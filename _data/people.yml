pi:
  name: Dr. Guta Wakbulcho Abeshu
  role: Assistant Professor
  department: Department of Civil & Environmental Engineering
  college: College of Engineering
  institute: Institute for Applied Practice in AI and Machine Learning
  institution: New Mexico State University
  email: gwabeshu@nmsu.edu
  image: /assets/img/pi-guta.JPG
  links:
    - label: Google Scholar
      url: "https://scholar.google.com/citations?user=oJwf_RwAAAAJ&hl=en"
    - label: GitHub
      url: "https://github.com/gutabeshu"
    - label: LinkedIn
      url: "https://www.linkedin.com/in/guta-wakbulcho-abeshu-a9088236/"
  bio: >-
    Dr. Guta Wakbulcho Abeshu is an Assistant Professor specializing in water
    resources engineering, hydrologic prediction, water systems intelligence,
    and AI-enabled climate adaptation. He is also the founder of the Abeshu
    Water Systems Intelligence Lab, where his research integrates
    physics-informed modeling, Earth observation, machine learning, and decision
    analytics for resilient water infrastructure and coupled
    climate-water-energy-infrastructure-society systems.

