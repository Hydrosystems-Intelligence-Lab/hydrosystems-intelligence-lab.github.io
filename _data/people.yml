  bio: >-
    Dr. Guta Wakbulcho Abeshu is an Assistant Professor specializing in water
    resources engineering, hydrologic prediction, water systems intelligence,
    and AI-enabled climate adaptation. He is also the founder of the Abeshu
    Hydrosystems Intelligence Lab, where his research integrates
    physics-informed modeling, Earth observation, machine learning, and decision
    analytics for resilient water infrastructure and coupled
    climate-water-energy-infrastructure-society systems.

