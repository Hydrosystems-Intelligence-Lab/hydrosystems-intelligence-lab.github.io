title: Abeshu Hydrosystems Intelligence Lab
tagline: Where climate, water, infrastructure, and human dynamics converge.
description: >-
  Data-driven, physics-informed, and decision-centered research for water
  prediction, infrastructure resilience, and climate adaptation.
social_image: /assets/img/water-systems-research-concept.png
manual_hero_image: /assets/img/nm-valles-caldera.jpg
manual_hero_image_position: center 50%
url: "https://hydrosystems-intelligence-lab.github.io"
# This repo is named <org>.github.io, so it is served at the domain root.
# baseurl must be empty ("") for a root/organization site or a custom domain.
baseurl: ""
lang: en
timezone: America/Denver

lab:
  short_name: Abeshu HSI Lab
  full_name: Abeshu Hydrosystems Intelligence Lab
  institution: New Mexico State University
  institution_logo: "/assets/img/New_Mexico_State_University_logo.svg"
  department: Department of Civil & Environmental Engineering
  college: College of Engineering
  institute: Institute for Applied Practice in AI and Machine Learning
  pi: Dr. Guta Wakbulcho Abeshu
  pi_title: Assistant Professor
  email: gwabeshu@nmsu.edu

# Privacy-friendly analytics. Paste your Cloudflare Web Analytics beacon token
# below to enable tracking; leave empty to disable (no script is loaded).
# Get a token at: https://dash.cloudflare.com → Analytics & Logs → Web Analytics.
analytics:
  cloudflare_token: ""

markdown: kramdown
permalink: /updates/:year/:month/:day/:title/

plugins:
  - jekyll-feed

# jekyll-feed: serve the feed at /feed.xml with Updates posts.
feed:
  posts_limit: 20

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LAUNCH_CHECKLIST.md
  - vendor/
