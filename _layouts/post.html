---
layout: default
---

<article class="content-section">
  <div class="wrapper narrow prose">
    <p class="eyebrow">Updates</p>
    <h1>{{ page.title }}</h1>
    <p class="post-date">{{ page.date | date: "%B %-d, %Y" }}</p>
    {{ content }}
    <p><a href="{{ '/updates/' | relative_url }}">Back to updates</a></p>
  </div>
</article>
