---
layout: default
---

<section
  class="page-hero{% if page.hero_image %} has-image{% endif %}"
  {% if page.hero_image %}
    style="--page-hero-image: url('{{ page.hero_image | relative_url }}'); --page-hero-position: {{ page.hero_image_position | default: 'center center' }};"
  {% endif %}
>
  <div class="wrapper page-hero-inner">
    {% if page.eyebrow %}
      <p class="eyebrow">{{ page.eyebrow }}</p>
    {% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.summary %}
      <p class="page-summary">{{ page.summary }}</p>
    {% endif %}
  </div>
</section>

<section class="content-section">
  <div class="wrapper {% if page.content_width == 'wide' %}wide-content{% else %}narrow{% endif %} prose">
    {{ content }}
  </div>
</section>
